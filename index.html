<div id="intro" role="dialog" aria-label="Invitation envelope">

      <span class="env-front"><svg viewBox="0 0 1600 1100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16110c"/><stop offset="1" stop-color="#0b0907"/></linearGradient>
          <linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b150e"/><stop offset="1" stop-color="#0e0b08"/></linearGradient>
          <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7e5c2a"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#7e5c2a"/></linearGradient>

        <path d="M0,0 L760,610 Q800,642 840,610 L1600,0 L1600,1100 L0,1100 Z" fill="url(#pk)"/>
        <path d="M0,1100 L740,560 Q800,516 860,560 L1600,1100 Z" fill="url(#pb)"/>
        <path d="M0,1100 L740,560 Q800,516 860,560 L1600,1100" fill="none" stroke="url(#gl)" stroke-width="2.4"/>
        <rect x="22" y="22" width="1556" height="1056" rx="6" fill="none" stroke="#d9b46a" stroke-opacity=".35" stroke-width="2"/>
      </svg></span>
      <span class="env-flap">
        <span class="face outside"><svg viewBox="0 0 1600 638" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211911"/><stop offset="1" stop-color="#120e0a"/></linearGradient>
            <linearGradient id="gl2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7e5c2a"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#7e5c2a"/></linearGradient>
          </defs>
          <path d="M0,0 H1600 L860,598 Q800,646 740,598 Z" fill="url(#fl)"/>

        </svg></span>
        <span class="face inside"><svg viewBox="0 0 1600 638" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <pattern id="fan" width="80" height="40" patternUnits="userSpaceOnUse">

          <path d="M0,638 L740,40 Q800,-8 860,40 L1600,638" fill="none" stroke="#d9b46a" stroke-width="2.6"/>
